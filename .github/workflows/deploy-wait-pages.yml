name: Deploy wait-time page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FIREBASE_WAIT_CONFIG_JSON: ${{ secrets.FIREBASE_WAIT_CONFIG_JSON }}
      FIREBASE_CROWD_CONFIG_JSON: ${{ secrets.FIREBASE_CROWD_CONFIG_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Write Firebase config
        if: ${{ env.FIREBASE_WAIT_CONFIG_JSON != '' }}
        working-directory: frontend
        run: |
          printf '%s' "$FIREBASE_WAIT_CONFIG_JSON" > public/wait/firebase_config.json

      - name: Write Firebase crowd config
        if: ${{ env.FIREBASE_CROWD_CONFIG_JSON != '' }}
        working-directory: frontend
        run: |
          printf '%s' "$FIREBASE_CROWD_CONFIG_JSON" > public/crowd/firebase_config.json

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白龍祭 待ち時間</title>
    <link rel="stylesheet" href="./wait.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Hakuryu Festival</p>
          <h1>待ち時間</h1>
          <p class="lead">各企画の現在の混雑状況を確認できます。</p>
        </div>
        <div class="status-card">
          <span id="connectionLabel">読み込み中</span>
          <strong id="updatedLabel">--:--</strong>
          <small>30秒ごとに更新</small>
        </div>
      </header>

      <section class="controls" aria-label="待ち時間の検索と絞り込み">
        <label>
          <span>検索</span>
          <input id="searchInput" type="search" placeholder="企画名・場所で検索" autocomplete="off" />
        </label>
        <label>
          <span>カテゴリ</span>
          <select id="categorySelect">
            <option value="">すべて</option>
          </select>
        </label>
      </section>

      <section class="summary-grid" aria-label="概要">
        <article>
          <span>企画数</span>
          <strong id="countValue">0</strong>
        </article>
        <article>
          <span>空いている</span>
          <strong id="quietValue">0</strong>
        </article>
        <article>
          <span>最長待ち</span>
          <strong id="maxValue">0分</strong>
        </article>
      </section>

      <section id="waitList" class="wait-list" aria-live="polite"></section>
      <p id="emptyMessage" class="empty-message" hidden>条件に合う企画がありません。</p>
    </main>

    <script src="./wait.js" defer></script>
  </body>
</html>
